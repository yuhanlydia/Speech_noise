name: cpu-tests

on:
  push:
    branches:
      - main
      - feature/qacr-mvp
      - feature/daa-mvp
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run test suite
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall src scripts
