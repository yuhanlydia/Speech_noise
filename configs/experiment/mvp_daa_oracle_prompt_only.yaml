model:
  model_id: Qwen/Qwen2.5-Omni-3B
  quantization: nf4
  thinker_only: true
  device_map: auto
  attention_backend: eager
data:
  manifest: data/mvp/pairs_eligible.jsonl
  seed: 0
method:
  name: daa
  layers: []
  router_dim: 32
  lambda_switch: 0.0
  lambda_identity: 0.0
  checkpoint: null
  daa:
    block_strategy: fixed
    focus_source: oracle
    apply_kv_mask: false
    block_seconds: 1.5
    max_blocks: 8
    max_focus_blocks: 8
    min_target_coverage: 0.8
    scan_max_new_tokens: 192
    select_max_new_tokens: 64
    answer_max_new_tokens: 64
output_dir: results/mvp_daa_oracle_prompt_only
seed: 0
